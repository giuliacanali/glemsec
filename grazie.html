<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W15H136MFL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', { 'analytics_storage': 'denied' });
  gtag('js', new Date());

  gtag('config', 'G-W15H136MFL');
</script>

<title>Grazie! | Glem Sec</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0d2639; --gold:#e2b253; --cream:#f4f2ed; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Montserrat',sans-serif; background:var(--cream); color:var(--navy); display:flex; flex-direction:column; min-height:100vh; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  h1{ font-size:clamp(28px,4vw,42px); margin:0 0 16px; }
  p{ font-size:16px; color:#1a3a52; margin:0 0 32px; }
  a{ display:inline-block; background:var(--gold); color:var(--navy); padding:14px 32px; border-radius:8px; text-decoration:none; font-weight:600; }

  .cookie-banner{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:2000;
    background:var(--navy);
    border-top:1px solid rgba(226,178,83,.3);
    padding:16px 20px;
    display:none;
  }
  .cookie-banner.show{ display:block; }
  .cookie-banner-inner{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .cookie-banner p{ margin:0; font-size:13px; color:#d4dde8; flex:1; min-width:220px; line-height:1.5; }
  .cookie-banner a{ display:inline; background:none; color:var(--gold); padding:0; border-radius:0; font-weight:400; text-decoration:underline; }
  .cookie-banner-actions{ display:flex; gap:10px; flex-shrink:0; }
  .cookie-banner button{
    font-family:inherit;
    cursor:pointer;
    border-radius:999px;
    padding:10px 20px;
    font-size:12.5px;
    font-weight:700;
    border:1.5px solid transparent;
    white-space:nowrap;
  }
  .cookie-banner-accept{ background:var(--gold); color:var(--navy); }
  .cookie-banner-reject{ background:transparent; color:var(--cream); border-color:rgba(226,178,83,.4); }
  @media (max-width:620px){
    .cookie-banner-inner{ flex-direction:column; align-items:stretch; }
    .cookie-banner-actions{ justify-content:stretch; }
    .cookie-banner button{ flex:1; }
  }
</style>
</head>
<body>
  <h1>Grazie per averci contattato!</h1>
  <p>Abbiamo ricevuto la tua richiesta. Ti risponderemo entro 24 ore.</p>
  <a href="index.html">Torna al sito</a>

  <div class="cookie-banner" id="cookieBanner">
    <div class="cookie-banner-inner">
      <p>Usiamo cookie tecnici necessari al funzionamento del sito e, solo con il tuo consenso, cookie di analisi per capire come viene usato. <a href="cookie.html" target="_blank">Scopri di più</a></p>
      <div class="cookie-banner-actions">
        <button type="button" class="cookie-banner-reject" id="cookieReject">Rifiuta</button>
        <button type="button" class="cookie-banner-accept" id="cookieAccept">Accetta</button>
      </div>
    </div>
  </div>
  <script>
    (function(){
      var consent = localStorage.getItem('cookieConsent');
      var banner = document.getElementById('cookieBanner');
      if (consent === 'granted') {
        gtag('consent', 'update', { analytics_storage: 'granted' });
      } else if (consent !== 'denied') {
        banner.classList.add('show');
      }
      document.getElementById('cookieAccept').addEventListener('click', function(){
        localStorage.setItem('cookieConsent', 'granted');
        gtag('consent', 'update', { analytics_storage: 'granted' });
        banner.classList.remove('show');
      });
      document.getElementById('cookieReject').addEventListener('click', function(){
        localStorage.setItem('cookieConsent', 'denied');
        banner.classList.remove('show');
      });
    })();
  </script>
</body>
</html>
